USE_MIXED_PRECISION: True
USE_TORCH_COMPILE: True

# Model Configuration
model_name: "TemporalResNetGRU"
MAX_EPISODE_STEPS: 250
NUM_STEPS_PER_ROLLOUT: 1024

LEARNING_RATE: 0.00005  # For pretrained ResNet backbone
GRU_LEARNING_RATE: 0.0003  # For GRU and policy/value heads
GAMMA: 0.99
GAE_LAMBDA: 0.95
VALUE_COEFF: 0.5
ENTROPY_COEFF: 0.008
CLIP_EPSILON: 0.2
PPO_EPOCHS: 2
BATCH_SIZE: 128
NUM_ROUNDS: 10000

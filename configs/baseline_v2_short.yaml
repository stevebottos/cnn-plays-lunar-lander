# Training and System Configuration
USE_MIXED_PRECISION: True
USE_TORCH_COMPILE: False

# Environment Configuration
env_name: "LunarLander-v3"
IMAGE_SIZE: 128
NUM_FRAMES: 16
MAX_EPISODE_STEPS: 500
REWARD_CLIP: 5.0

# Model Configuration
model_name: "TinyCNNv2"

# PPO Hyperparameters
LEARNING_RATE: 0.0003
GAMMA: 0.99
GAE_LAMBDA: 0.95
VALUE_COEFF: 0.01
ENTROPY_COEFF: 0.01
CLIP_EPSILON: 0.2
PPO_EPOCHS: 4
COLLECT_EPISODES: 32
BATCH_SIZE: 64
NUM_ROUNDS: 5
